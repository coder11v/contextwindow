<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Player Platformer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-4xl font-bold mb-4">Two-Player Platformer</h1>
  <p class="mb-4">Player 1: WASD to move and jump. Player 2: Arrow keys to move and jump. Reach the top using portals!
  </p>
  <canvas id="gameCanvas" width="800" height="600" class="border border-white"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game variables
    const gravity = 0.5;
    const jumpStrength = -12;
    const playerSpeed = 5;

    // Player 1 (WASD)
    const player1 = {
      x: 100,
      y: 500,
      width: 20,
      height: 20,
      vx: 0,
      vy: 0,
      color: 'red',
      onGround: false
    };

    // Player 2 (Arrows)
    const player2 = {
      x: 200,
      y: 500,
      width: 20,
      height: 20,
      vx: 0,
      vy: 0,
      color: 'blue',
      onGround: false
    };

    // Platforms
    const platforms = [
      { x: 0, y: 550, width: 800, height: 50 }, // Ground
      { x: 200, y: 450, width: 100, height: 20 },
      { x: 400, y: 350, width: 100, height: 20 },
      { x: 600, y: 250, width: 100, height: 20 },
      { x: 300, y: 150, width: 100, height: 20 },
      { x: 500, y: 50, width: 100, height: 20 }  // Top platform
    ];

    // Portals (pairs: enter one, teleport to the other)
    const portals = [
      { x: 250, y: 430, width: 20, height: 20, color: 'purple', target: { x: 450, y: 330 } },
      { x: 450, y: 330, width: 20, height: 20, color: 'purple', target: { x: 650, y: 230 } },
      { x: 650, y: 230, width: 20, height: 20, color: 'purple', target: { x: 350, y: 130 } },
      { x: 350, y: 130, width: 20, height: 20, color: 'purple', target: { x: 550, y: 30 } }
    ];

    // Keys
    const keys = {};

    // Event listeners
    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
    });
    document.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Collision detection
    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y;
    }

    // Update player
    function updatePlayer(player, leftKey, rightKey, jumpKey) {
      // Horizontal movement
      if (keys[leftKey]) player.vx = -playerSpeed;
      else if (keys[rightKey]) player.vx = playerSpeed;
      else player.vx = 0;

      // Jump
      if (keys[jumpKey] && player.onGround) {
        player.vy = jumpStrength;
        player.onGround = false;
      }

      // Gravity
      player.vy += gravity;

      // Update position
      player.x += player.vx;
      player.y += player.vy;

      // Check platform collisions
      player.onGround = false;
      for (let platform of platforms) {
        if (checkCollision(player, platform)) {
          // Landing on top
          if (player.vy > 0 && player.y < platform.y) {
            player.y = platform.y - player.height;
            player.vy = 0;
            player.onGround = true;
          }
          // Hitting from below (optional, for ceiling)
          else if (player.vy < 0 && player.y > platform.y) {
            player.y = platform.y + platform.height;
            player.vy = 0;
          }
        }
      }

      // Check portal collisions
      for (let portal of portals) {
        if (checkCollision(player, portal)) {
          player.x = portal.target.x;
          player.y = portal.target.y;
          player.vy = 0; // Reset velocity
        }
      }

      // Keep in bounds
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
      if (player.y + player.height > canvas.height) {
        player.y = canvas.height - player.height;
        player.vy = 0;
        player.onGround = true;
      }
    }

    // Draw
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw platforms
      ctx.fillStyle = 'green';
      for (let platform of platforms) {
        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
      }

      // Draw portals
      for (let portal of portals) {
        ctx.fillStyle = portal.color;
        ctx.fillRect(portal.x, portal.y, portal.width, portal.height);
      }

      // Draw players
      ctx.fillStyle = player1.color;
      ctx.fillRect(player1.x, player1.y, player1.width, player1.height);
      ctx.fillStyle = player2.color;
      ctx.fillRect(player2.x, player2.y, player2.width, player2.height);

      // Check win condition (reach top)
      if (player1.y < 50 || player2.y < 50) {
        ctx.fillStyle = 'yellow';
        ctx.font = '48px Arial';
        ctx.fillText('You Win!', 300, 300);
      }
    }

    // Game loop
    function gameLoop() {
      updatePlayer(player1, 'a', 'd', 'w');
      updatePlayer(player2, 'ArrowLeft', 'ArrowRight', 'ArrowUp');
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>

</html>
